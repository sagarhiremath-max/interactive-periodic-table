<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Elements Lab | Redirecting...</title>
    <script type="text/javascript">
      // Forward non-hash routes to HashRouter route on GitHub Pages
      var l = window.location;
      var base = '/interactive-periodic-table';
      var path = l.pathname;
      if (path.startsWith(base)) {
        path = path.substring(base.length);
      }
      if (!path || path === '/') {
        path = '/';
      } else if (!path.startsWith('/')) {
        path = '/' + path;
      }
      var target = l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') + base + '/#' + path + (l.search ? l.search : '') + l.hash;
      window.location.replace(target);
    </script>
  </head>
  <body style="background-color: #050814; color: #cbd5e1; font-family: sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0;">
    <p>Redirecting to Elements Lab...</p>
  </body>
</html>
